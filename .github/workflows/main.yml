
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/asiacell/fleet

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AsiacellFleet"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.asiacell.fleet'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.asiacell.fleet'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="موافقات أسطول آسيا سيل"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/asiacell/fleet/MainActivity.java <<'EOF'
          package com.asiacell.fleet;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setGravity(Gravity.CENTER);
                  page.setPadding(32, 32, 32, 32);
                  page.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView title = new TextView(this);
                  title.setText("نظام موافقات أسطول آسيا سيل");
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  page.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("النسخة الأولية للتطبيق");
                  subtitle.setTextSize(16);
                  subtitle.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams subParams =
                      new LinearLayout.LayoutParams(-1, -2);
                  subParams.topMargin = 20;
                  page.addView(subtitle, subParams);

                  EditText phone = new EditText(this);
                  phone.setHint("أدخل رقم الهاتف");
                  phone.setInputType(3);
                  LinearLayout.LayoutParams phoneParams =
                      new LinearLayout.LayoutParams(-1, -2);
                  phoneParams.topMargin = 32;
                  page.addView(phone, phoneParams);

                  Button next = new Button(this);
                  next.setText("متابعة");
                  LinearLayout.LayoutParams buttonParams =
                      new LinearLayout.LayoutParams(-1, -2);
                  buttonParams.topMargin = 16;
                  page.addView(next, buttonParams);

                  next.setOnClickListener(v ->
                      Toast.makeText(this, "راح نضيف تسجيل الدخول بالمرحلة القادمة",
                          Toast.LENGTH_LONG).show()
                  );

                  setContentView(page);
              }
          }
          EOF

      - name: Save project files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle build.gradle app
          git diff --cached --quiet || git commit -m "Create initial Android app"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asiacell-fleet-apk
          path: app/build/outputs/apk/debug/app-debug.apk
